name: Check, and deploy main to docs.vibelabsmc.org

# Pull requests and every push: all checks. Pushes to main: checks, then deploy to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so pages without lastUpdated get their date from git.
          fetch-depth: 0
      # Astro 7 runs on Node; Bun installs packages and runs the scripts and tests.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test
      - name: Type-check
        run: bun run typecheck
      - name: Build (fails on bad frontmatter, unknown components or pipeline passes)
        run: bun run build
      # Both need the route list (.nimbus/routes.json) that the build writes.
      - name: Lint the docs, including internal links
        run: bun run lint:docs
      - name: Nimbus preflight
        run: bun run check
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v6
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
